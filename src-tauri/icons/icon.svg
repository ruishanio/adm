<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1024" height="1024" viewBox="0 0 1254 1254" fill="none" role="img" aria-labelledby="icon-title icon-description">
  <title id="icon-title">ADM — 三台设备与管理底座</title>
  <desc id="icon-description">根据已确认的 ADM 图标重绘的可编辑矢量版本。三台蓝色、钢蓝色和石墨色设备依次置于深色底座，屏幕留白，底座饰有薄荷绿色 Android 标记。Android robot attribution: The Android robot is reproduced or modified from work created and shared by Google and used according to terms described in the Creative Commons 3.0 Attribution License. https://creativecommons.org/licenses/by/3.0/</desc>
  <defs>
    <radialGradient id="tile-fill" cx="0" cy="0" r="1" gradientTransform="translate(590 523) rotate(70) scale(796 866)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBFAF7"/>
      <stop offset=".74" stop-color="#F9F8F3"/>
      <stop offset="1" stop-color="#EEECE5"/>
    </radialGradient>
    <linearGradient id="tile-edge" x1="626" y1="96" x2="626" y2="1155" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F6F4ED"/>
      <stop offset="1" stop-color="#D5D3CD"/>
    </linearGradient>
    <linearGradient id="base-side" x1="264" y1="874" x2="1041" y2="874" gradientUnits="userSpaceOnUse">
      <stop stop-color="#454C57"/>
      <stop offset=".13" stop-color="#4B5361"/>
      <stop offset=".31" stop-color="#4C5462"/>
      <stop offset=".39" stop-color="#49515E"/>
      <stop offset=".61" stop-color="#39414D"/>
      <stop offset=".84" stop-color="#3A404A"/>
      <stop offset="1" stop-color="#383E48"/>
    </linearGradient>
    <linearGradient id="base-shade" x1="626" y1="810" x2="626" y2="959" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".035"/>
      <stop offset=".55" stop-color="#0C1420" stop-opacity=".02"/>
      <stop offset="1" stop-color="#0C1420" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="base-top" x1="575" y1="656" x2="690" y2="861" gradientUnits="userSpaceOnUse">
      <stop stop-color="#636C79"/>
      <stop offset=".52" stop-color="#606A78"/>
      <stop offset="1" stop-color="#545D6B"/>
    </linearGradient>
    <radialGradient id="base-sheen" cx="0" cy="0" r="1" gradientTransform="translate(390 842) scale(260 164)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CDD5E1" stop-opacity=".035"/>
      <stop offset=".85" stop-color="#CDD5E1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="base-side-light" cx="0" cy="0" r="1" gradientTransform="translate(870 774) scale(250 150)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B4C2D4" stop-opacity=".025"/>
      <stop offset="1" stop-color="#B4C2D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slot-fill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#606B7B"/>
      <stop offset=".28" stop-color="#37424F"/>
      <stop offset=".65" stop-color="#101822"/>
      <stop offset=".85" stop-color="#111923"/>
      <stop offset="1" stop-color="#27313F"/>
    </linearGradient>
    <linearGradient id="rear-depth" x1="809" y1="377" x2="987" y2="721" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6B7384"/>
      <stop offset=".45" stop-color="#444A55"/>
      <stop offset="1" stop-color="#343B46"/>
    </linearGradient>
    <linearGradient id="rear-face" x1="735" y1="404" x2="938" y2="733" gradientUnits="userSpaceOnUse">
      <stop stop-color="#444E5B"/>
      <stop offset="1" stop-color="#252F3A"/>
    </linearGradient>
    <linearGradient id="middle-depth" x1="588" y1="406" x2="807" y2="773" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7999C1"/>
      <stop offset=".45" stop-color="#56779F"/>
      <stop offset="1" stop-color="#344F70"/>
    </linearGradient>
    <linearGradient id="middle-face" x1="570" y1="437" x2="772" y2="786" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4D709A"/>
      <stop offset="1" stop-color="#2A445F"/>
    </linearGradient>
    <linearGradient id="front-depth" x1="419" y1="447" x2="667" y2="821" gradientUnits="userSpaceOnUse">
      <stop stop-color="#287BFF"/>
      <stop offset=".36" stop-color="#246DF7"/>
      <stop offset=".7" stop-color="#0749CF"/>
      <stop offset="1" stop-color="#0443BF"/>
    </linearGradient>
    <linearGradient id="front-face" x1="387" y1="474" x2="610" y2="841" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0053E6"/>
      <stop offset=".58" stop-color="#004AD2"/>
      <stop offset="1" stop-color="#003DBA"/>
    </linearGradient>
    <linearGradient id="housing-light" x1="0" y1="0" x2=".35" y2="1">
      <stop stop-color="#E7F3FF" stop-opacity=".12"/>
      <stop offset=".23" stop-color="#E7F3FF" stop-opacity=".025"/>
      <stop offset=".58" stop-color="#101A2C" stop-opacity="0"/>
      <stop offset="1" stop-color="#101A2C" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="screen-fill" x1=".5" y1="0" x2=".5" y2="1">
      <stop stop-color="#C2E1FC"/>
      <stop offset=".2" stop-color="#C1E0FC"/>
      <stop offset=".5" stop-color="#BBDCFD"/>
      <stop offset=".78" stop-color="#B0D6FC"/>
      <stop offset="1" stop-color="#9FCCF9"/>
    </linearGradient>
    <radialGradient id="screen-light" cx=".46" cy=".28" r=".8">
      <stop stop-color="#F5FAFF" stop-opacity=".035"/>
      <stop offset="1" stop-color="#F5FAFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="speaker-fill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#252E37"/>
      <stop offset=".55" stop-color="#343D46"/>
      <stop offset="1" stop-color="#303B45"/>
    </linearGradient>
    <linearGradient id="android-fill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7CE7A4"/>
      <stop offset="1" stop-color="#63D993"/>
    </linearGradient>
    <filter id="tile-shadow" x="-10%" y="-10%" width="120%" height="124%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="tile-blur"/>
      <feOffset dy="3" result="offset-shadow"/>
      <feFlood flood-color="#42413A" flood-opacity=".1"/>
      <feComposite in2="offset-shadow" operator="in" result="outer-shadow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="tile-inner-blur"/>
      <feOffset in="tile-inner-blur" dx="-4" dy="-5" result="tile-inner-offset"/>
      <feComposite in="SourceAlpha" in2="tile-inner-offset" operator="out" result="inner-edge"/>
      <feFlood flood-color="#8B857A" flood-opacity=".27"/>
      <feComposite in2="inner-edge" operator="in" result="inner-shadow"/>
      <feMerge><feMergeNode in="outer-shadow"/><feMergeNode in="SourceGraphic"/><feMergeNode in="inner-shadow"/></feMerge>
    </filter>
    <filter id="ground-blur" x="-12%" y="-65%" width="124%" height="230%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="edge-soften" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="bevel-soften" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="contact-soften" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="speaker-soften" x="-15%" y="-35%" width="130%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation=".7"/>
    </filter>
    <!-- 程序化微弱材质仍随矢量缩放，不嵌入位图；仅用于消除底座过于均匀的色块感。 -->
    <filter id="base-material" x="-2%" y="-2%" width="104%" height="104%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".055" numOctaves="3" seed="12" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="monochrome"/>
      <feComponentTransfer in="monochrome" result="grain"><feFuncA type="linear" slope=".015"/></feComponentTransfer>
      <feComposite in="grain" in2="SourceAlpha" operator="in" result="material-grain"/>
      <feBlend in="SourceGraphic" in2="material-grain" mode="soft-light"/>
    </filter>
    <filter id="glass-material" x="-1%" y="-1%" width="102%" height="102%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .025" numOctaves="2" seed="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="monochrome"/>
      <feComponentTransfer in="monochrome" result="grain"><feFuncA type="linear" slope=".025"/></feComponentTransfer>
      <feComposite in="grain" in2="SourceAlpha" operator="in" result="glass-grain"/>
      <feBlend in="SourceGraphic" in2="glass-grain" mode="soft-light"/>
    </filter>
    <clipPath id="base-contour" clipPathUnits="userSpaceOnUse"><use href="#base-silhouette"/></clipPath>
    <!-- 逐一校准三处槽口，不再统一放大两端；同处槽口与前壁使用完全一致的接触曲线。 -->
    <path id="front-opening" d="M345 762L393 747Q409 743 428 747L655 791Q682 796 681 805Q680 815 656 822L593 842Q575 848 553 843L341 798Q319 793 319 783Q319 771 345 762Z"/>
    <path id="front-back-bevel" d="M319 783Q319 771 345 762L393 747Q409 743 428 747L655 791Q682 796 681 805"/>
    <path id="front-wall" d="M0 0H1254V650L681 805Q680 815 656 822L593 842Q575 848 553 843L341 798Q319 793 319 783H0Z"/>
    <path id="middle-opening" d="M551 721L594 706Q608 702 624 706L820 742Q845 747 844 756Q843 764 821 771L765 787Q750 792 733 788L548 753Q522 748 522 741Q523 731 551 721Z"/>
    <path id="middle-back-bevel" d="M522 741Q523 731 551 721L594 706Q608 702 624 706L820 742Q845 747 844 756"/>
    <path id="middle-wall" d="M0 0H1254V650L844 756Q843 764 821 771L765 787Q750 792 733 788L548 753Q522 748 522 741H0Z"/>
    <path id="rear-opening" d="M739 675L780 663Q791 660 806 663L980 693Q1003 697 1003 704Q1003 711 985 717L930 736Q917 741 900 738L738 707Q712 702 713 691Q714 682 739 675Z"/>
    <path id="rear-back-bevel" d="M713 691Q714 682 739 675L780 663Q791 660 806 663L980 693Q1003 697 1003 704"/>
    <path id="rear-wall" d="M0 0H1254V650L1003 704Q1003 711 985 717L930 736Q917 741 900 738L738 707Q712 702 713 691H0Z"/>
    <!-- 向槽壁内延伸 0.65 单位，避免抗锯齿混合产生虚假的细黑缝。 -->
    <clipPath id="front-seating" clipPathUnits="userSpaceOnUse">
      <use href="#front-wall" transform="translate(0 .65)"/>
    </clipPath>
    <clipPath id="middle-seating" clipPathUnits="userSpaceOnUse">
      <use href="#middle-wall" transform="translate(0 .65)"/>
    </clipPath>
    <clipPath id="rear-seating" clipPathUnits="userSpaceOnUse">
      <use href="#rear-wall" transform="translate(0 .65)"/>
    </clipPath>
  </defs>

  <!-- 背板独立成组；透明区域不含原始位图的杂边。 -->
  <g id="background-tile" inkscape:groupmode="layer" inkscape:label="01 背板">
    <path d="M343 97H909C1075 97 1172 192 1172 359V891C1172 1059 1076 1153 910 1153H342C174 1153 79 1058 79 891V359C79 191 175 97 343 97Z" fill="url(#tile-fill)" stroke="url(#tile-edge)" stroke-opacity=".35" stroke-width=".6" filter="url(#tile-shadow)"/>
  </g>

  <!-- 底座由顶面、侧面与三个凹槽组成，方便分别调整颜色。 -->
  <g id="docking-base" inkscape:groupmode="layer" inkscape:label="02 底座">
    <path d="M281 887L536 944Q561 951 589 943L1027 799L1041 824L591 975Q559 987 521 978L275 925Z" fill="#494438" opacity=".3" filter="url(#ground-blur)"/>
    <!-- 接触阴影紧贴底边，环境阴影负责向外扩散，避免底座像贴在背景上的色块。 -->
    <path d="M271 895Q276 903 289 908L530 958Q557 964 585 955L1019 816Q1036 808 1041 790" stroke="#302E29" stroke-opacity=".32" stroke-width="7" filter="url(#contact-soften)"/>
    <g filter="url(#base-material)" clip-path="url(#base-contour)">
    <!-- 底色覆盖整个底座轮廓，顶面叠绘其上，消除两个抗锯齿边缘之间的透底亮缝。 -->
    <path id="base-silhouette" d="M264 799Q264 787 287 776L352 744L741 639Q761 633 781 639L1008 686Q1040 693 1041 709V790Q1041 808 1019 816L585 955Q557 964 530 958L289 908Q264 903 264 882Z" fill="url(#base-side)"/>
    <path d="M264 799C264 808 278 814 294 817L526 865Q555 873 585 863L1018 731Q1041 723 1041 709L1041 790Q1041 808 1019 816L585 955Q557 964 530 958L289 908Q264 903 264 882Z" fill="url(#base-shade)"/>
    <path d="M264 799C264 808 278 814 294 817L526 865Q555 873 585 863L1018 731Q1041 723 1041 709L1041 790Q1041 808 1019 816L585 955Q557 964 530 958L289 908Q264 903 264 882Z" fill="url(#base-sheen)"/>
    <path d="M264 799C264 808 278 814 294 817L526 865Q555 873 585 863L1018 731Q1041 723 1041 709L1041 790Q1041 808 1019 816L585 955Q557 964 530 958L289 908Q264 903 264 882Z" fill="url(#base-side-light)"/>
    <path d="M264 799Q264 787 287 776L352 744L741 639Q761 633 781 639L1008 686Q1040 693 1041 709Q1041 723 1018 731L585 863Q555 873 526 865L294 817C278 814 264 808 264 799Z" fill="url(#base-top)" filter="url(#bevel-soften)"/>
    <path d="M264 799C264 808 278 814 294 817L526 865Q555 873 585 863L1018 731Q1041 723 1041 709" stroke="#A6B0C1" stroke-opacity=".22" stroke-width="8" filter="url(#bevel-soften)"/>
    <!-- 槽口保留独立内壁和高光，开口宽度依据原图分别校准。 -->
    <g id="device-slots" fill="url(#slot-fill)">
      <g id="rear-slot">
        <use href="#rear-back-bevel" fill="none" stroke="#1A2330" stroke-opacity=".35" stroke-width="4" filter="url(#edge-soften)"/>
        <use href="#rear-opening"/>
        <use href="#rear-back-bevel" fill="none" stroke="#9AA5B6" stroke-opacity=".3" stroke-width="3" filter="url(#edge-soften)"/>
      </g>
      <g id="middle-slot">
        <use href="#middle-back-bevel" fill="none" stroke="#1A2330" stroke-opacity=".35" stroke-width="4" filter="url(#edge-soften)"/>
        <use href="#middle-opening"/>
        <use href="#middle-back-bevel" fill="none" stroke="#9AA5B6" stroke-opacity=".3" stroke-width="3" filter="url(#edge-soften)"/>
      </g>
      <g id="front-slot">
        <use href="#front-back-bevel" fill="none" stroke="#1A2330" stroke-opacity=".35" stroke-width="4" filter="url(#edge-soften)"/>
        <use href="#front-opening"/>
        <use href="#front-back-bevel" fill="none" stroke="#9AA5B6" stroke-opacity=".3" stroke-width="3" filter="url(#edge-soften)"/>
      </g>
    </g>
    </g>
  </g>

  <!-- 三台设备保持独立路径，按后、中、前顺序绘制遮挡。 -->
  <g id="rear-device" inkscape:groupmode="layer" inkscape:label="03 后排设备" clip-path="url(#rear-seating)">
    <path d="M687 431C689 397 719 372 763 377L916 397C956 402 981 432 981 475V770H686V660Z" fill="url(#rear-depth)"/>
    <path d="M687 431C689 397 719 372 763 377L916 397C956 402 981 432 981 475V770H686V660Z" fill="url(#housing-light)"/>
    <path d="M735 392L900 413C932 417 951 442 951 478V770H688V440C688 409 706 389 735 392Z" fill="url(#rear-face)"/>
    <path d="M693 696V440C693 409 708 390 736 393L899 414C930 418 949 442 949 478V750" stroke="#A1AEC1" stroke-opacity=".24" stroke-width="8" filter="url(#bevel-soften)"/>
    <path d="M693 696V440C693 409 708 390 736 393L899 414C930 418 949 442 949 478V750" stroke="#A1AEC1" stroke-opacity=".18" stroke-width="3" filter="url(#edge-soften)"/>
    <g filter="url(#glass-material)">
    <path id="rear-screen" d="M753 422L902 441C919 443 929 457 929 478V700C929 716 920 725 905 722L742 690Q725 686 725 666V448C725 429 735 419 753 422Z" fill="url(#screen-fill)" stroke="#D5EBFC" stroke-opacity=".72" stroke-width="1.4"/>
    <path d="M753 422L902 441C919 443 929 457 929 478V700C929 716 920 725 905 722L742 690Q725 686 725 666V448C725 429 735 419 753 422Z" fill="url(#screen-light)"/>
    </g>
    <path d="M818 442L851 446Q860 447 860 454Q860 463 852 462L818 458Q809 457 809 449Q809 441 818 442Z" stroke="#E2EFF8" stroke-opacity=".55" stroke-width="3" filter="url(#speaker-soften)"/>
    <path d="M818 442L851 446Q860 447 860 454Q860 463 852 462L818 458Q809 457 809 449Q809 441 818 442Z" fill="url(#speaker-fill)" stroke="#263540" stroke-opacity=".65" stroke-width="1"/>
  </g>

  <g id="middle-device" inkscape:groupmode="layer" inkscape:label="04 中排设备" clip-path="url(#middle-seating)">
    <path d="M531 463C536 426 568 400 610 406L747 426C789 433 814 463 814 505V820H529V709Z" fill="url(#middle-depth)"/>
    <path d="M531 463C536 426 568 400 610 406L747 426C789 433 814 463 814 505V820H529V709Z" fill="url(#housing-light)"/>
    <path d="M576 424L730 447C764 452 786 477 786 511V820H530V473C530 443 548 420 576 424Z" fill="url(#middle-face)"/>
    <path d="M535 750V473C535 444 551 421 577 424L730 448C763 453 784 477 784 512V805" stroke="#B1CEF0" stroke-opacity=".25" stroke-width="8" filter="url(#bevel-soften)"/>
    <path d="M535 750V473C535 444 551 421 577 424L730 448C763 453 784 477 784 512V805" stroke="#B1CEF0" stroke-opacity=".18" stroke-width="3" filter="url(#edge-soften)"/>
    <g filter="url(#glass-material)">
    <path id="middle-screen" d="M585 453L735 477C752 480 764 493 764 515V744C764 761 754 773 739 770L574 732Q557 728 557 708V482C557 461 569 451 585 453Z" fill="url(#screen-fill)" stroke="#D5EBFC" stroke-opacity=".72" stroke-width="1.4"/>
    <path d="M585 453L735 477C752 480 764 493 764 515V744C764 761 754 773 739 770L574 732Q557 728 557 708V482C557 461 569 451 585 453Z" fill="url(#screen-light)"/>
    </g>
    <path d="M651 475L685 480Q695 481 695 489Q695 498 686 497L650 492Q642 491 642 483Q642 474 651 475Z" stroke="#E2EFF8" stroke-opacity=".55" stroke-width="3" filter="url(#speaker-soften)"/>
    <path d="M651 475L685 480Q695 481 695 489Q695 498 686 497L650 492Q642 491 642 483Q642 474 651 475Z" fill="url(#speaker-fill)" stroke="#263540" stroke-opacity=".65" stroke-width="1"/>
  </g>

  <g id="front-device" inkscape:groupmode="layer" inkscape:label="05 前排设备" clip-path="url(#front-seating)">
    <path d="M343 514C343 472 381 439 424 445L575 466C620 473 646 504 646 546V875H342V760Z" fill="url(#front-depth)"/>
    <path d="M343 514C343 472 381 439 424 445L575 466C620 473 646 504 646 546V875H342V760Z" fill="url(#housing-light)"/>
    <path d="M394 465L560 487C593 492 612 518 612 551V875H342V521C342 487 363 461 394 465Z" fill="url(#front-face)"/>
    <path d="M347 798V521C347 487 366 461 395 465L560 488C592 493 610 519 610 551V860" stroke="#7EB3FF" stroke-opacity=".28" stroke-width="9" filter="url(#bevel-soften)"/>
    <path d="M347 798V521C347 487 366 461 395 465L560 488C592 493 610 519 610 551V860" stroke="#7EB3FF" stroke-opacity=".22" stroke-width="3" filter="url(#edge-soften)"/>
    <g filter="url(#glass-material)">
    <path id="front-screen" d="M398 496L557 519C575 522 587 535 587 556V796C587 815 576 827 560 824L394 789Q369 784 369 757V525C369 506 381 493 398 496Z" fill="url(#screen-fill)" stroke="#D5EBFC" stroke-opacity=".72" stroke-width="1.4"/>
    <path d="M398 496L557 519C575 522 587 535 587 556V796C587 815 576 827 560 824L394 789Q369 784 369 757V525C369 506 381 493 398 496Z" fill="url(#screen-light)"/>
    </g>
    <path d="M462 517L498 522Q508 523 508 532Q508 541 498 540L462 534Q453 533 453 525Q453 516 462 517Z" stroke="#E2EFF8" stroke-opacity=".55" stroke-width="3" filter="url(#speaker-soften)"/>
    <path d="M462 517L498 522Q508 523 508 532Q508 541 498 540L462 534Q453 533 453 525Q453 516 462 517Z" fill="url(#speaker-fill)" stroke="#263540" stroke-opacity=".65" stroke-width="1"/>
  </g>

  <!-- 保留已确认的下移位置；边缘高光和眼睛暗部仅补充轻微材质层次。 -->
  <g id="android-mark" inkscape:groupmode="layer" inkscape:label="06 Android 标记">
    <g transform="matrix(1 .218 0 1 350 856)">
      <path d="M45 0C20 0 0 20 0 45V47Q0 49 2 49H88Q90 49 90 47V45C90 20 70 0 45 0ZM26 20C22 20 19 23 19 27C19 31 22 34 26 34C30 34 33 31 33 27C33 23 30 20 26 20ZM65 20C61 20 58 23 58 27C58 31 61 34 65 34C69 34 72 31 72 27C72 23 69 20 65 20Z" fill="url(#android-fill)" fill-rule="evenodd" stroke="#BEF9CF" stroke-opacity=".32" stroke-width="1"/>
      <circle cx="26" cy="27" r="6.6" fill="#19372C" opacity=".24"/>
      <circle cx="65" cy="27" r="6.6" fill="#19372C" opacity=".24"/>
      <path d="M27 5L20-10M64 5L77-10" stroke="#7EE3A3" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>
</svg>
