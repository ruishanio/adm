name: Package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            os: macos-latest
            platform: mac
            arch: arm64
          - target: win-x64
            os: windows-latest
            platform: win
            arch: x64
    steps:
      - name: 检出 tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 配置 Node.js 与 npm 缓存
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 校验 tag 并准备固定版本的 ADB
        run: python scripts/package_ci.py prepare ${{ matrix.platform }} ${{ matrix.arch }}

      - name: 安装锁定前端依赖
        run: npm ci --no-audit --no-fund

      - name: 自动化测试
        run: |
          npm test
          python -m unittest discover -s tests/release -v

      - name: 配置锁定的 Rust 工具链
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy

      - name: Rust 格式与静态检查
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Rust 后端回归测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: 类型检查与生产构建
        run: npm run build

      - name: 生成应用分发包
        run: node scripts/package.mjs ${{ matrix.platform }}

      - name: 验证分发包并生成校验清单
        run: python scripts/package_ci.py verify ${{ matrix.platform }} ${{ matrix.arch }}

      - name: 验证安装包内容与安装流程
        run: python scripts/package_ci.py smoke-install ${{ matrix.platform }} ${{ matrix.arch }}

      # ADB 对应源码等问题必须有可复核证据；构建成功不能替代分发许可核对。
      - name: 核对公开分发许可
        run: npm run licenses:release-check

      # 应用 ZIP 保留内部权限和符号链接；同平台安装包及校验清单一并上传。
      - name: 上传可下载产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ADM-${{ github.ref_name }}-${{ matrix.target }}
          path: |
            release/ADM-*.zip
            release/ADM-*.dmg
            release/ADM-*-setup.exe
            release/SHA256SUMS.txt
            release/build-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: 发布 GitHub Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 仅发布任务拥有写权限；两个平台全部成功才会进入此任务。
    permissions:
      contents: write
    steps:
      - name: 检出同一 tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: 下载本次运行的双平台产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ADM-${{ github.ref_name }}-*
          path: artifacts/release-downloads
          # 两个平台有同名的校验清单及构建信息，先分目录下载，再校验合并。
          merge-multiple: false

      - name: 校验附件并发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_ci.py --publish
