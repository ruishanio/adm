name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支或 PR 的新提交替换旧检查，两个平台仍分别汇报结果。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Tauri 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: windows-latest
            platform: win
            arch: x64
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 配置 Node.js 与 npm 缓存
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 准备固定版本 ADB
        run: python scripts/package_ci.py prepare ${{ matrix.platform }} ${{ matrix.arch }}

      - name: 安装锁定依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查与生产构建
        run: npm run build

      - name: 自动化测试
        run: npm test

      - name: 配置锁定的 Rust 工具链
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy

      - name: Rust 格式与静态检查
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Rust 后端回归测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
